name: Documentation

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "docs/versions.json"
      - ".github/scripts/*doc*"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - "Makefile"
  pull_request:
    paths:
      - "docs/versions.json"
      - ".github/scripts/*doc*"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - "Makefile"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check documentation tooling
        run: bash --version && jq --version

      - name: Resolve JDK version
        id: java
        run: echo "version=$(.github/scripts/java-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Override the action's default of "tools platform-tools": Google
          # has removed the legacy "tools" package from the SDK repository
          # entirely, so requesting it 404s. This repo never needed it –
          # building and testing only use cmdline-tools, platform-tools, and
          # the NDK.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test documentation tooling
        run: make docs-test

      - name: Build versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: make docs-versioned

      - name: Upload Documentation Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/docs-versioned

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
