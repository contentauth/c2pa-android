name: Tests

on:
  push:
    # Tracking branches run their own per-sync gate via track-c2pa-rs.yml and
    # are force-pushed frequently; the full matrix runs for them only as the
    # pre-promotion gate.
    branches-ignore:
      - "track/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test. Defaults to the triggering ref."
        required: false
        default: ""
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [33, 35]
        target: [google_apis]
        arch: [x86_64]
        include:
          # 32-bit ABI run at the library's minSdk. The JNI bridge ships
          # armeabi-v7a and x86 and has pointer-width-dependent code (int64
          # results, usize parameters), and no other job runs at the minimum
          # supported level. 32-bit x86 google_apis images exist for 28-30.
          - api-level: 28
            target: google_apis
            arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AAR
        run: make library

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.arch }}-${{ matrix.target }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests with coverage
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        env:
          BEARER_TOKEN: test-12345
          SIGNING_SERVER_URL: http://10.0.2.2:8080
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: make tests-with-server

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.api-level }}-${{ matrix.arch }}
          path: library/build/reports/androidTests/

      - name: Upload coverage reports to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.api-level }}-${{ matrix.arch }}
          path: |
            library/build/reports/jacoco/jacocoInstrumentedTestReport/
            library/build/reports/coverage/androidTest/debug/connected/

      - name: Upload coverage reports to Codecov
        # inputs.ref is set only when track-c2pa-rs.yml calls this workflow.
        if: always() && inputs.ref == ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: contentauth/c2pa-android

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Cheap and toolchain-free, so it runs before the SDK setup below.
      - name: Check C2PA target lists agree
        run: .github/scripts/check-target-drift.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AAR
        run: make library

      - name: Run lint
        run: make lint

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            library/build/reports/lint-results-*.html
            example-app/app/build/reports/lint-results-*.html
