# JitPack reads this file as static YAML before the build starts, so the JDK
# version cannot be read from gradle/libs.versions.toml the way the Gradle
# modules and the CI workflows do. These literals are the only copies of the
# Java version left in the repo; check-java-version-drift.sh fails the build
# if they fall behind the `java` version in the catalog.
jdk:
  - openjdk17

before_install:
  - sdk install java 17.0.2-open
  - sdk use java 17.0.2-open

install:
  - ./gradlew :library:publishToMavenLocal
